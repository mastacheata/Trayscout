name: Build and release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        shell: bash
        run: |
          git fetch --tags --force
          latest=$(git tag --list | grep -E '^[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          latest=${latest:-1.0}
          major=${latest%%.*}
          minor=${latest##*.}
          next="$major.$((minor + 1))"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Previous: $latest, next: $next"

      - name: Set assembly version
        shell: bash
        run: |
          v="${{ steps.version.outputs.version }}.0.0"
          sed -i -E "s/(Assembly(File)?Version\(\")[0-9.]+(\"\))/\1$v\3/" Source/Properties/AssemblyInfo.cs
          grep -n "Version(" Source/Properties/AssemblyInfo.cs

      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2

      - name: Restore packages
        run: nuget restore Source/Trayscout.sln

      - name: Build
        run: msbuild Source/Trayscout.sln /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp Source/bin/Release/Trayscout.exe dist/
          cp Assets/Symbols.png Assets/Config.ini dist/
          cd dist
          7z a "../Trayscout_${{ steps.version.outputs.version }}.zip" ./*

      - name: Create release and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.version }}"
          gh release create "$v" "Trayscout_$v.zip" \
            --target "${{ github.sha }}" \
            --title "$v" \
            --generate-notes
